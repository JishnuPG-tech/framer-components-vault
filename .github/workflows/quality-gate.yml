name: Anti-Slop Quality Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'fixtures/**'
      - 'packages/**'
      - 'policies/**'
      - 'tools/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'fixtures/**'
      - 'packages/**'
      - 'policies/**'
      - 'tools/**'
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-verify:
    name: Evaluate Anti-Slop & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Anti-Slop Unit & Repair Loop Tests
        run: |
          cd packages/anti-slop-engine
          node --test tests/*.test.js

      - name: Run Quality Gate Verification Against Accepted Fixtures
        run: |
          node packages/cli/bin/framer-craft.js verify fixtures/accepted
