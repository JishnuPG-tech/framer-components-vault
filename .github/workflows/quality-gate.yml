name: Anti-Slop Quality Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'fixtures/**'
      - 'packages/**'
      - 'policies/**'
      - 'tools/**'
      - '.github/workflows/quality-gate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'fixtures/**'
      - 'packages/**'
      - 'policies/**'
      - 'tools/**'
      - '.github/workflows/quality-gate.yml'
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-verify:
    name: Evaluate Anti-Slop & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Anti-Slop Engine Optional Playwright & Chromium
        continue-on-error: true
        run: |
          cd packages/anti-slop-engine
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Run Anti-Slop Unit, Repair Loop & Live-URL Tests
        run: |
          cd packages/anti-slop-engine
          node --test tests/*.test.js

      - name: Verify Accepted & Regression Reference Fixtures Pass
        run: |
          node packages/cli/bin/framer-craft.js verify fixtures/accepted
          node packages/cli/bin/framer-craft.js verify fixtures/regression

      - name: Verify Generic Slop Regression Fixture Correctly Fails
        run: |
          if node packages/cli/bin/framer-craft.js audit fixtures/generic; then
            echo "ERROR: fixtures/generic unexpectedly passed the quality gate!"
            exit 1
          else
            echo "PASS: fixtures/generic correctly blocked by quality gate."
          fi
